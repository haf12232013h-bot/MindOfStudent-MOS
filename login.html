<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MOS Login - Minds Of Student</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #4F46E5 0%, #06B6D4 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        body.light {
            background: linear-gradient(135deg, #F8FAFC 0%, #E0F2FE 100%);
        }

        .login-container {
            background: white;
            padding: 40px;
            border-radius: 15px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            width: 100%;
            max-width: 420px;
        }

        body.light .login-container {
            background: white;
            box-shadow: 0 10px 30px rgba(79, 70, 229, 0.1);
        }

        .logo {
            text-align: center;
            margin-bottom: 30px;
        }

        .logo-star {
            font-size: 40px;
            margin-bottom: 10px;
        }

        .logo h1 {
            font-size: 28px;
            color: #4F46E5;
            margin-bottom: 5px;
        }

        .logo p {
            color: #666;
            font-size: 14px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: #111827;
        }

        input, select {
            width: 100%;
            padding: 12px;
            border: 2px solid #E5E7EB;
            border-radius: 8px;
            font-size: 14px;
            transition: all 0.3s;
        }

        input:focus, select:focus {
            outline: none;
            border-color: #4F46E5;
            box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.1);
        }

        .btn-login {
            width: 100%;
            padding: 12px;
            background: linear-gradient(135deg, #4F46E5 0%, #06B6D4 100%);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s;
            margin-top: 10px;
        }

        .btn-login:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(79, 70, 229, 0.3);
        }

        .demo-accounts {
            background: #F3F4F6;
            padding: 15px;
            border-radius: 8px;
            margin-top: 20px;
            font-size: 12px;
        }

        .account {
            margin-bottom: 10px;
            padding-bottom: 10px;
            border-bottom: 1px solid #E5E7EB;
        }

        .account:last-child {
            border-bottom: none;
            margin-bottom: 0;
            padding-bottom: 0;
        }

        .account strong {
            color: #4F46E5;
        }

        .theme-toggle {
            position: fixed;
            top: 20px;
            right: 20px;
            background: rgba(255,255,255,0.2);
            border: none;
            color: white;
            padding: 10px 15px;
            border-radius: 50%;
            cursor: pointer;
            font-size: 20px;
        }

        @media (max-width: 480px) {
            .login-container {
                margin: 20px;
            }
        }
    </style>
</head>
<body>
    <button class="theme-toggle" onclick="toggleTheme()">🌙</button>

    <div class="login-container">
        <div class="logo">
            <div class="logo-star">⭐</div>
            <h1>MOS</h1>
            <p>Minds Of Student</p>
        </div>

        <form onsubmit="handleLogin(event)">
            <div class="form-group">
                <label for="email">School Email *</label>
                <input type="email" id="email" required placeholder="your@school.edu">
            </div>

            <div class="form-group">
                <label for="password">Password *</label>
                <input type="password" id="password" required placeholder="••••••••">
            </div>

            <div class="form-group">
                <label for="role">I am a... *</label>
                <select id="role" required>
                    <option value="">Select your role</option>
                    <option value="student">Student</option>
                    <option value="teacher">Teacher</option>
                    <option value="staff">Staff Member</option>
                    <option value="parent">Parent</option>
                    <option value="admin">Administrator</option>
                </select>
            </div>

            <button type="submit" class="btn-login">Login</button>
        </form>

        <div class="demo-accounts">
            <strong>🎮 Try Demo Accounts:</strong>
            <div class="account">
                <strong>Student:</strong> student@mos.edu / student123
            </div>
            <div class="account">
                <strong>Teacher:</strong> teacher@mos.edu / teacher123
            </div>
            <div class="account">
                <strong>Parent:</strong> parent@mos.edu / parent123
            </div>
            <div class="account">
                <strong>Admin:</strong> admin@mos.edu / admin123
            </div>
        </div>
    </div>

    <script>
        function handleLogin(event) {
            event.preventDefault();
            const email = document.getElementById('email').value;
            const role = document.getElementById('role').value;

            sessionStorage.setItem('email', email);
            sessionStorage.setItem('role', role);

            if (role === 'student') {
                window.location.href = 'student-dashboard.html';
            } else if (role === 'teacher') {
                window.location.href = 'teacher-dashboard.html';
            } else if (role === 'parent') {
                window.location.href = 'parent-dashboard.html';
            } else if (role === 'admin') {
                window.location.href = 'admin-dashboard.html';
            }
        }

        function toggleTheme() {
            document.body.classList.toggle('light');
            localStorage.setItem('mosTheme', document.body.classList.contains('light') ? 'light' : 'dark');
        }

        if (localStorage.getItem('mosTheme') === 'light') {
            document.body.classList.add('light');
        }
    </script>
</body>
</html>
